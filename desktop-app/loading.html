<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Flow</title>
  <!--
    Shown while the app's local server starts. A real file on purpose: this
    used to be a data: URL, and the first "#" in its CSS colours ended the URL
    (everything after "#" is a fragment), so the window showed a blank black
    page for the whole start-up. No web fonts and no network: this must paint
    at once, offline. logo.png sits next to it (desktop-app/package.json files).
  -->
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #06070b;
      color: #f5f5f7;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* The window has no title bar, so the whole screen can move it. */
      -webkit-app-region: drag;
      user-select: none;
      cursor: default;
    }

    /* Slow soft light in the background. */
    .glow { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.55; pointer-events: none; }
    .glow.a { width: 520px; height: 520px; background: #2f5fd0; top: -180px; left: -140px; animation: drift-a 16s ease-in-out infinite alternate; }
    .glow.b { width: 440px; height: 440px; background: #6d3fd6; bottom: -200px; right: -120px; opacity: 0.4; animation: drift-b 20s ease-in-out infinite alternate; }
    @keyframes drift-a { to { transform: translate(120px, 90px) scale(1.15); } }
    @keyframes drift-b { to { transform: translate(-110px, -70px) scale(1.1); } }

    main { position: relative; width: min(440px, 84vw); text-align: center; }

    /* The logo on a turning ring of light. */
    .mark { position: relative; width: 112px; height: 112px; margin: 0 auto 26px; }
    .mark img {
      position: relative; z-index: 2; display: block; width: 88px; height: 88px; margin: 12px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 18px 50px rgba(47, 95, 208, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.12);
      animation: float 3.2s ease-in-out infinite;
    }
    .mark .ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 55%, #5b8cff 75%, #b18cff 90%, transparent 100%);
      -webkit-mask: radial-gradient(circle, transparent 52px, #000 53px);
              mask: radial-gradient(circle, transparent 52px, #000 53px);
      animation: spin 1.6s linear infinite;
    }
    .mark .pulse {
      position: absolute; inset: 6px; border-radius: 50%;
      border: 2px solid rgba(91, 140, 255, 0.35);
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes pulse { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.45); opacity: 0; } }

    h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    #status { margin: 6px 0 26px; font-size: 13px; color: #9aa3b5; min-height: 1.3em; }

    .bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; position: relative; }
    .bar span {
      position: absolute; inset: 0 auto 0 -40%; width: 40%; border-radius: 4px;
      background: linear-gradient(90deg, #5b8cff, #b18cff);
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide { to { left: 100%; } }

    /* Fun fact card. */
    .fact {
      margin-top: 30px; padding: 16px 18px; border-radius: 18px; text-align: left;
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; gap: 14px; align-items: flex-start; min-height: 64px;
    }
    .fact .icon {
      flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
      background: rgba(91, 140, 255, 0.16); font-size: 17px;
    }
    .fact .label { margin: 0 0 3px; font-size: 10px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #8c97ff; }
    #fact, #fact-icon { transition: opacity 0.45s, filter 0.45s, transform 0.45s; }
    #fact { margin: 0; font-size: 13.5px; line-height: 1.5; color: #d9dde6; }
    .out { opacity: 0; filter: blur(6px); transform: translateY(4px); }

    #slow { margin: 16px 0 0; font-size: 12px; color: #6b7385; line-height: 1.5; visibility: hidden; }

    @media (prefers-reduced-motion: reduce) {
      .glow, .mark img, .mark .pulse { animation: none; }
      .mark .ring { animation-duration: 4s; }
      .bar span { animation-duration: 3s; }
      #fact, #fact-icon { transition: none; }
    }
  </style>
</head>
<body>
  <div class="glow a" aria-hidden="true"></div>
  <div class="glow b" aria-hidden="true"></div>
  <main>
    <div class="mark" aria-hidden="true">
      <div class="pulse"></div>
      <div class="ring"></div>
      <img src="logo.png" alt="" width="88" height="88">
    </div>
    <h1>Study Flow</h1>
    <p id="status" role="status" aria-live="polite">Starting…</p>
    <div class="bar" aria-hidden="true"><span></span></div>

    <div class="fact">
      <div class="icon" id="fact-icon" aria-hidden="true">💡</div>
      <div>
        <p class="label">Did you know?</p>
        <p id="fact"></p>
      </div>
    </div>

    <p id="slow">The first start after turning on your computer or an update takes a little longer.</p>
  </main>
  <script>
    // main.js calls this as start-up moves along.
    window.setStatus = (text) => { document.getElementById('status').textContent = text; };
    setTimeout(() => { document.getElementById('slow').style.visibility = 'visible'; }, 6000);

    // Short study facts, a new one every few seconds, starting at a random one.
    const FACTS = [
      ['🧠', 'Testing yourself beats rereading: recalling an answer makes it stick far better than seeing it again.'],
      ['⏱️', 'Spacing revision over several days helps you remember for longer than one long cram session.'],
      ['😴', 'Sleep is when your brain files away what you learned today. A good night helps tomorrow’s exam.'],
      ['🔀', 'Mixing different kinds of questions in one session makes you better at picking the right method.'],
      ['✍️', 'Explaining a topic in your own words, as if teaching a friend, shows you exactly what you do not get yet.'],
      ['📵', 'Just having your phone on the desk can pull your focus, even face down. Put it in another room.'],
      ['🚶', 'A short walk before studying can sharpen your attention for the next hour.'],
      ['💧', 'Even mild thirst can make it harder to concentrate. Keep water nearby.'],
      ['🍅', 'The Pomodoro method, 25 minutes of focus then a 5-minute break, was named after a tomato-shaped kitchen timer.'],
      ['🎯', 'Starting with the hardest task while your mind is fresh makes the rest of the session feel easier.'],
      ['📝', 'Writing notes by hand makes you summarise as you go, which helps you remember the ideas.'],
      ['🔁', 'You forget much of what you learn within a day unless you review it. A quick look the next day saves hours later.'],
      ['🌙', 'Reviewing your notes just before sleep helps them stick overnight.'],
      ['🧩', 'Breaking a big topic into small pieces makes it easier to start, and starting is often the hardest part.'],
      ['🎧', 'Music with words competes with reading for your attention. Instrumental music distracts less.'],
      ['⚡', 'Your brain uses about a fifth of your body’s energy, even though it is only about 2% of your weight.'],
    ];
    const factEl = document.getElementById('fact');
    const iconEl = document.getElementById('fact-icon');
    let i = Math.floor(Math.random() * FACTS.length);
    const show = () => { iconEl.textContent = FACTS[i][0]; factEl.textContent = FACTS[i][1]; };
    show();
    setInterval(() => {
      factEl.classList.add('out');
      iconEl.classList.add('out');
      setTimeout(() => {
        i = (i + 1) % FACTS.length;
        show();
        factEl.classList.remove('out');
        iconEl.classList.remove('out');
      }, 450);
    }, 5500);
  </script>
</body>
</html>
