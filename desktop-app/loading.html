<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Flow</title>
  <!--
    Shown while the app's local server starts. A real file on purpose: this
    used to be a data: URL, and the first "#" in its CSS colours ended the URL
    (everything after "#" is a fragment), so the window showed a blank black
    page for the whole start-up. No web fonts: this must paint at once, offline.
  -->
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #050505;
      color: #f5f5f5;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      /* The window has no title bar, so the whole screen can move it. */
      -webkit-app-region: drag;
      user-select: none;
      cursor: default;
    }
    main { width: min(360px, 80vw); text-align: center; }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 20px;
      border-radius: 16px; background: #3b82f6;
      display: grid; place-items: center;
      box-shadow: 0 10px 40px rgba(59, 130, 246, 0.35);
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    #status { margin: 0 0 22px; font-size: 13px; color: #9ca3af; min-height: 1.3em; }
    .bar { height: 4px; border-radius: 4px; background: #1a1a1a; overflow: hidden; position: relative; }
    .bar span {
      position: absolute; inset: 0 auto 0 -40%; width: 40%;
      border-radius: 4px; background: #3b82f6;
      animation: slide 1.4s ease-in-out infinite;
    }
    #slow { margin: 18px 0 0; font-size: 12px; color: #6b7280; line-height: 1.5; visibility: hidden; }
    @keyframes slide { to { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .bar span { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
      </svg>
    </div>
    <h1>Study Flow</h1>
    <p id="status" role="status" aria-live="polite">Starting…</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <p id="slow">The first start after turning on your computer or an update takes a little longer.</p>
  </main>
  <script>
    // main.js calls this as start-up moves along.
    window.setStatus = (text) => { document.getElementById('status').textContent = text; };
    setTimeout(() => { document.getElementById('slow').style.visibility = 'visible'; }, 6000);
  </script>
</body>
</html>
